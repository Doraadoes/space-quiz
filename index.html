<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Orbit Quiz — A Space Exploration Quiz</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f1f3ff;
      --surface: #fff;
      --surface-soft: #f5f5ff;
      --text: #1d2143;
      --muted: #626987;
      --border: #dfe2f2;
      --accent: #6246d9;
      --accent-strong: #4e31c7;
      --accent-soft: #eeeaff;
      --correct: #087847;
      --correct-bg: #e2f8ec;
      --incorrect: #bd2944;
      --incorrect-bg: #fff0f1;
      --focus: #f3a712;
      --shadow: 0 24px 80px rgb(48 44 105 / 12%);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111326;
        --surface: #1c1f38;
        --surface-soft: #252943;
        --text: #f4f3ff;
        --muted: #b0b4d0;
        --border: #3a3e5b;
        --accent: #b1a0ff;
        --accent-strong: #c3b7ff;
        --accent-soft: #33304e;
        --correct: #77e0a8;
        --correct-bg: #173a30;
        --incorrect: #ff9cac;
        --incorrect-bg: #492630;
        --focus: #ffd166;
        --shadow: 0 24px 80px rgb(0 0 0 / 28%);
      }
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 32px 20px;
      display: grid;
      place-items: center;
      color: var(--text);
      background:
        radial-gradient(ellipse at 12% 12%, rgb(164 145 255 / 16%), transparent 38%),
        radial-gradient(ellipse at 92% 88%, rgb(75 177 255 / 13%), transparent 34%),
        var(--page);
      font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif;
    }

    button { font: inherit; }

    .app {
      width: min(100%, 760px);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 0 0 20px;
      color: var(--muted);
      font-size: .9rem;
      font-weight: 750;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .brand-mark {
      display: grid;
      width: 35px;
      height: 35px;
      place-items: center;
      border-radius: 12px;
      color: white;
      background: linear-gradient(145deg, #997bff, #5540cf);
      box-shadow: 0 5px 16px rgb(98 70 217 / 30%);
      font-size: 1.2rem;
    }

    .card {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .quiz-content { padding: clamp(24px, 6vw, 48px); }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .eyebrow {
      margin: 0;
      color: var(--accent);
      font-size: .82rem;
      font-weight: 800;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .score {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 13px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface-soft);
      font-size: .9rem;
      font-weight: 750;
      white-space: nowrap;
    }

    .score-value { color: var(--accent); font-variant-numeric: tabular-nums; }

    .progress-track {
      height: 10px;
      overflow: hidden;
      border-radius: 99px;
      background: var(--surface-soft);
    }

    .progress-fill {
      width: 10%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #9273ff, #5d46d7);
      transition: width 400ms ease;
    }

    .progress-label {
      display: block;
      margin: 8px 0 30px;
      color: var(--muted);
      font-size: .8rem;
      text-align: right;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.65rem, 4vw, 2.25rem);
      letter-spacing: -.035em;
      line-height: 1.2;
    }

    .question {
      min-height: 2.7em;
      margin: 0 0 25px;
      font-size: clamp(1.12rem, 2.5vw, 1.35rem);
      font-weight: 650;
      line-height: 1.5;
    }

    .answers {
      display: grid;
      gap: 12px;
    }

    .answer {
      width: 100%;
      min-height: 58px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 16px;
      border: 1.5px solid var(--border);
      border-radius: 15px;
      color: var(--text);
      background: var(--surface);
      cursor: pointer;
      text-align: left;
      transition: border-color 160ms ease, background-color 160ms ease, transform 160ms ease;
    }

    .answer:not(:disabled):hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .answer:focus-visible, .primary-button:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .answer:disabled { cursor: default; }

    .answer-letter {
      display: grid;
      flex: 0 0 31px;
      width: 31px;
      height: 31px;
      place-items: center;
      border-radius: 10px;
      color: var(--muted);
      background: var(--surface-soft);
      font-size: .85rem;
      font-weight: 800;
    }

    .answer-text { line-height: 1.4; }

    .answer.is-correct {
      border-color: var(--correct);
      color: var(--correct);
      background: var(--correct-bg);
      animation: pop 420ms ease both;
    }

    .answer.is-correct .answer-letter {
      color: var(--correct);
      background: color-mix(in srgb, var(--correct) 14%, transparent);
    }

    .answer.is-wrong {
      border-color: var(--incorrect);
      color: var(--incorrect);
      background: var(--incorrect-bg);
      animation: shake 420ms ease both;
    }

    .answer.is-wrong .answer-letter {
      color: var(--incorrect);
      background: color-mix(in srgb, var(--incorrect) 14%, transparent);
    }

    .feedback {
      min-height: 27px;
      margin: 17px 0 0;
      color: var(--muted);
      font-weight: 700;
      line-height: 1.5;
    }

    .feedback.correct { color: var(--correct); }
    .feedback.wrong { color: var(--incorrect); }

    .actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 20px;
    }

    .primary-button {
      min-height: 48px;
      padding: 0 22px;
      border: 0;
      border-radius: 14px;
      color: #fff;
      background: linear-gradient(135deg, #8064ee, #563dc7);
      box-shadow: 0 6px 16px rgb(98 70 217 / 24%);
      cursor: pointer;
      font-weight: 800;
      transition: transform 160ms ease, filter 160ms ease;
    }

    .primary-button:hover { transform: translateY(-2px); filter: brightness(1.08); }
    .primary-button[hidden] { display: none; }

    .result {
      padding: clamp(32px, 8vw, 64px) 24px;
      text-align: center;
    }

    .result[hidden] { display: none; }
    .quiz[hidden] { display: none; }

    .reaction {
      margin: 0 0 10px;
      font-size: clamp(7rem, 28vw, 11rem);
      line-height: 1.2;
      animation: pop 520ms cubic-bezier(.2, .8, .3, 1.3) both;
    }

    .result h1 { margin-bottom: 10px; }

    .result-score {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: clamp(2rem, 7vw, 3rem);
      font-weight: 900;
      letter-spacing: -.04em;
    }

    .result-copy {
      max-width: 420px;
      margin: 0 auto 28px;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .result .primary-button { min-width: 170px; }

    .footer-note {
      margin: 17px 0 0;
      color: var(--muted);
      font-size: .78rem;
      text-align: center;
    }

    @keyframes shake {
      15%, 45%, 75% { transform: translateX(-6px); }
      30%, 60%, 90% { transform: translateX(6px); }
    }

    @keyframes pop {
      50% { transform: scale(1.035); }
    }

    @media (max-width: 480px) {
      body { padding: 20px 14px; }
      .card { border-radius: 22px; }
      .progress-label { margin-bottom: 24px; }
      .topline { align-items: flex-start; }
      .score { padding: 7px 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <p class="brand"><span class="brand-mark" aria-hidden="true">✦</span> Orbit Quiz</p>
    <section class="card" aria-label="Space exploration quiz">
      <div class="quiz quiz-content" id="quiz">
        <div class="topline">
          <p class="eyebrow">Space exploration</p>
          <div class="score" aria-label="Current score">
            <span aria-hidden="true">★</span>
            Score <span class="score-value" id="score">0</span>
          </div>
        </div>
        <div class="progress-track" id="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="1" aria-valuemax="10" aria-valuenow="1">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <span class="progress-label" id="progress-label">Question 1 of 10</span>
        <h1 id="quiz-title">Ready for liftoff?</h1>
        <p class="question" id="question"></p>
        <div class="answers" id="answers" role="group" aria-labelledby="question"></div>
        <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
        <div class="actions">
          <button class="primary-button" id="next-button" type="button" hidden>Next question <span aria-hidden="true">→</span></button>
        </div>
      </div>
      <div class="result" id="result" aria-labelledby="result-title" hidden>
        <p class="reaction" id="reaction" aria-hidden="true"></p>
        <h1 id="result-title" tabindex="-1">Mission complete!</h1>
        <p class="result-score" id="result-score"></p>
        <p class="sr-only" id="result-announcement" role="status" aria-live="polite" aria-atomic="true"></p>
        <p class="result-copy" id="result-copy"></p>
        <button class="primary-button" id="restart-button" type="button">Play again <span aria-hidden="true">↻</span></button>
      </div>
    </section>
    <p class="footer-note">10 questions · one small step for your score, one giant leap for your brain</p>
  </main>

  <script>
    (() => {
      const questions = [
        {
          question: "Which planet is known as the Red Planet?",
          answers: ["Venus", "Mars", "Mercury", "Jupiter"],
          correct: 1,
          fact: "Mars looks red because iron-rich dust covers much of its surface."
        },
        {
          question: "What was the first artificial satellite to orbit Earth?",
          answers: ["Explorer 1", "Apollo 11", "Sputnik 1", "Voyager 1"],
          correct: 2,
          fact: "The Soviet Union launched Sputnik 1 in 1957."
        },
        {
          question: "Which is the largest planet in our solar system?",
          answers: ["Saturn", "Neptune", "Earth", "Jupiter"],
          correct: 3,
          fact: "Jupiter is so large that more than 1,300 Earths could fit inside it."
        },
        {
          question: "What is the name of the galaxy that contains our solar system?",
          answers: ["Andromeda", "The Milky Way", "Whirlpool Galaxy", "Sombrero Galaxy"],
          correct: 1,
          fact: "Our solar system is in the Milky Way, a barred spiral galaxy."
        },
        {
          question: "Which celestial body did humans first land on?",
          answers: ["Mars", "The Moon", "Venus", "An asteroid"],
          correct: 1,
          fact: "Apollo 11 astronauts first walked on the Moon in July 1969."
        },
        {
          question: "What do we call a rocky object that burns up in Earth's atmosphere?",
          answers: ["Asteroid", "Meteor", "Comet", "Dwarf planet"],
          correct: 1,
          fact: "A meteor is the streak of light made when a meteoroid enters the atmosphere."
        },
        {
          question: "Which planet has the most prominent ring system?",
          answers: ["Saturn", "Uranus", "Jupiter", "Neptune"],
          correct: 0,
          fact: "All four giant planets have rings, but Saturn's are the brightest and most visible."
        },
        {
          question: "What is the name of NASA's first crewed lunar program?",
          answers: ["Gemini", "Mercury", "Apollo", "Artemis"],
          correct: 2,
          fact: "The Apollo program carried the first humans to the Moon."
        },
        {
          question: "Which planet is famous for its Great Red Spot?",
          answers: ["Mars", "Jupiter", "Saturn", "Neptune"],
          correct: 1,
          fact: "Jupiter's Great Red Spot is a gigantic storm that has raged for centuries."
        },
        {
          question: "What force keeps planets in orbit around the Sun?",
          answers: ["Magnetism", "Friction", "Gravity", "Solar wind"],
          correct: 2,
          fact: "The Sun's gravity holds the planets in their paths around it."
        }
      ];

      const quiz = document.querySelector("#quiz");
      const result = document.querySelector("#result");
      const scoreDisplay = document.querySelector("#score");
      const progressTrack = document.querySelector("#progress-track");
      const progressFill = document.querySelector("#progress-fill");
      const progressLabel = document.querySelector("#progress-label");
      const questionDisplay = document.querySelector("#question");
      const answersContainer = document.querySelector("#answers");
      const feedback = document.querySelector("#feedback");
      const nextButton = document.querySelector("#next-button");
      const resultTitle = document.querySelector("#result-title");
      const resultAnnouncement = document.querySelector("#result-announcement");
      let questionIndex = 0;
      let score = 0;
      let answered = false;

      function renderQuestion() {
        const current = questions[questionIndex];
        answered = false;
        questionDisplay.textContent = current.question;
        progressTrack.setAttribute("aria-valuenow", String(questionIndex + 1));
        progressFill.style.width = `${((questionIndex + 1) / questions.length) * 100}%`;
        progressLabel.textContent = `Question ${questionIndex + 1} of ${questions.length}`;
        feedback.textContent = "";
        feedback.className = "feedback";
        nextButton.hidden = true;
        answersContainer.replaceChildren();

        current.answers.forEach((answer, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "answer";
          button.innerHTML = `<span class="answer-letter" aria-hidden="true">${String.fromCharCode(65 + index)}</span><span class="answer-text"></span>`;
          button.querySelector(".answer-text").textContent = answer;
          button.addEventListener("click", () => selectAnswer(index, button));
          answersContainer.append(button);
        });
      }

      function selectAnswer(selectedIndex, selectedButton) {
        if (answered) return;
        answered = true;
        const current = questions[questionIndex];
        const buttons = [...answersContainer.querySelectorAll(".answer")];
        buttons.forEach(button => { button.disabled = true; });

        if (selectedIndex === current.correct) {
          score += 1;
          scoreDisplay.textContent = String(score);
          selectedButton.classList.add("is-correct");
          feedback.textContent = `Correct! ${current.fact}`;
          feedback.classList.add("correct");
        } else {
          selectedButton.classList.add("is-wrong");
          buttons[current.correct].classList.add("is-correct");
          feedback.textContent = `Not quite. ${current.fact}`;
          feedback.classList.add("wrong");
        }

        nextButton.innerHTML = questionIndex === questions.length - 1
          ? 'See results <span aria-hidden="true">→</span>'
          : 'Next question <span aria-hidden="true">→</span>';
        nextButton.hidden = false;
        nextButton.focus();
      }

      function showResults() {
        const percentage = Math.round((score / questions.length) * 100);
        const reaction = document.querySelector("#reaction");
        const copy = document.querySelector("#result-copy");
        const resultScore = document.querySelector("#result-score");
        const resultData = percentage === 100
          ? ["🚀", "Incredible! You're a cosmic champion."]
          : percentage >= 70
            ? ["🌟", "Stellar work! You've got a galaxy of knowledge."]
            : percentage >= 40
              ? ["🪐", "Nice orbit! There's even more of the universe to explore."]
              : ["🌙", "Every space expert starts somewhere. Ready for another launch?"];

        quiz.hidden = true;
        result.hidden = false;
        reaction.textContent = resultData[0];
        resultAnnouncement.textContent = `Final score: ${score} out of ${questions.length}.`;
        resultScore.textContent = `0 / ${questions.length}`;
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches || score === 0) {
          resultScore.textContent = `${score} / ${questions.length}`;
        } else {
          const duration = 900;
          const startTime = performance.now();
          const countUp = currentTime => {
            const progress = Math.min((currentTime - startTime) / duration, 1);
            const easedProgress = 1 - (1 - progress) ** 3;
            const displayedScore = Math.floor(score * easedProgress);
            resultScore.textContent = `${progress === 1 ? score : displayedScore} / ${questions.length}`;
            if (progress < 1) requestAnimationFrame(countUp);
          };
          requestAnimationFrame(countUp);
        }
        copy.textContent = `${resultData[1]} You got ${percentage}% of the questions right.`;
        progressTrack.setAttribute("aria-valuenow", String(questions.length));
        progressFill.style.width = "100%";
        progressLabel.textContent = "Quiz complete";
        resultTitle.focus();
      }

      nextButton.addEventListener("click", () => {
        if (!answered) return;
        if (questionIndex === questions.length - 1) {
          showResults();
          return;
        }
        questionIndex += 1;
        renderQuestion();
        answersContainer.querySelector("button").focus();
      });

      document.querySelector("#restart-button").addEventListener("click", () => {
        questionIndex = 0;
        score = 0;
        scoreDisplay.textContent = "0";
        resultAnnouncement.textContent = "";
        result.hidden = true;
        quiz.hidden = false;
        renderQuestion();
        answersContainer.querySelector("button").focus();
      });

      renderQuestion();
    })();
  </script>
</body>
</html>
